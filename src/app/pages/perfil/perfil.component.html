<div class="p-8 bg-slate-50 dark:bg-slate-900 min-h-screen animate-fade-in">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <header class="flex justify-between items-end border-b border-slate-200 dark:border-slate-800 pb-6">
      <div>
        <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Configurações do Usuário</h2>
        <p class="text-slate-500 dark:text-slate-400">Gerencie sua conta e preferências do Lumen Apex</p>
      </div>
      <button (click)="sair()" class="px-4 py-2 text-sm font-bold text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl transition-all">
        Sair da Sessão
      </button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Coluna da Esquerda: Avatar e Info Rápida -->
      <div class="space-y-6">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm text-center">
          <div class="w-24 h-24 bg-blue-600 rounded-3xl mx-auto mb-4 flex items-center justify-center text-3xl font-bold text-white shadow-xl shadow-blue-500/20">
            L
          </div>
          <h3 class="font-bold text-slate-900 dark:text-white">{{ usuario().nome }}</h3>
          <p class="text-xs text-slate-500 uppercase tracking-widest font-bold mt-1">{{ usuario().empresa }}</p>
        </div>

        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
          <label class="text-xs font-bold text-slate-400 uppercase">Tema do Sistema</label>
          <button (click)="theme.toggleTheme()" class="w-full mt-2 flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-blue-500 transition-all">
            <span class="text-sm font-medium">{{ theme.darkMode() ? 'Modo Escuro' : 'Modo Claro' }}</span>
            <span>{{ theme.darkMode() ? '🌙' : '☀️' }}</span>
          </button>
        </div>
      </div>

      <!-- Coluna da Direita: Formulários -->
      <div class="md:col-span-2 space-y-6">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
          <h4 class="font-bold text-slate-900 dark:text-white mb-6">Dados Pessoais</h4>
          
          <div class="grid grid-cols-1 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nome Completo</label>
              <input [(ngModel)]="usuario().nome" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase mb-1">E-mail de Contato</label>
              <input [(ngModel)]="usuario().email" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
            </div>
          </div>

          <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3">
            <button (click)="resetarSistema()" class="px-6 py-3 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all">Resetar Preferências</button>
            <button (click)="salvarAlteracoes()" class="px-8 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-500/20 transition-all">
              Salvar Dados
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
